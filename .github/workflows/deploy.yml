name: Deploy AI Article Curation

on:
  # 1日3回自動実行（信頼性向上のため複数回設定）
  # JST 9:00, 15:00, 21:00 (UTC 0:00, 6:00, 12:00)
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'

  # 手動実行も可能
  workflow_dispatch:

  # mainブランチへのpush時にも実行
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

# 同時実行を防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-research-app/package-lock.json

      - name: Install dependencies
        working-directory: ./ai-research-app
        run: npm ci

      - name: Fetch articles from Zenn/Qiita/note
        working-directory: ./ai-research-app
        run: |
          echo "📝 記事を収集中..."
          mkdir -p data
          npm run fetch
          echo "✅ 収集完了"

      - name: Commit article updates (keeps workflow active)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ai-research-app/data/articles.json ai-research-app/public/articles.json || true
          if git diff --staged --quiet; then
            echo "📭 記事に変更なし"
          else
            git commit -m "🤖 記事を自動更新 $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "📬 記事の更新をコミットしました"
          fi

      - name: Build Next.js app
        working-directory: ./ai-research-app
        run: |
          echo "🔨 ビルド中..."
          npm run build
          echo "✅ ビルド完了"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ai-research-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
